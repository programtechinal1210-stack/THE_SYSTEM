<div class="modal-content"><div class="modal-header"><h3>إنشاء مستخدم جديد</h3><button class="close-btn" onclick="closeModal()">&times;</button></div><div class="modal-body"><form hx-post="{% url 'users:create' %}" hx-target="#users-table" hx-swap="innerHTML">{% csrf_token %}<div class="form-group"><label>اسم المستخدم</label><input type="text" name="username" class="form-control" required></div><div class="form-group"><label>الاسم الكامل</label><input type="text" name="full_name" class="form-control" required></div><div class="form-group"><label>كلمة المرور</label><input type="password" name="password" class="form-control" required></div><div class="form-group"><label>البريد الإلكتروني</label><input type="email" name="email" class="form-control" required></div><div class="form-group"><label>الدور</label><select name="role" class="form-control"><option value="viewer">مطلع</option><option value="executor">منفذ</option><option value="reviewer">مراجع</option><option value="secretary">سكرتارية</option><option value="followup">متابعة</option><option value="manager">مدير المكتب</option><option value="admin">مدير النظام</option></select></div><button type="submit" class="btn btn-primary">حفظ</button></form></div></div>
