<!-- ===== مودال: تغيير كلمة المرور ===== -->
<div class="modal-overlay" id="passwordModal">
    <div class="modal-content" style="max-width:500px;">
        <div class="modal-header">
            <h2><i class="fas fa-lock"></i> تغيير كلمة المرور</h2>
            <button class="close-btn" onclick="UsersManager.closeModal('passwordModal')">&times;</button>
        </div>
        <div class="modal-body">
            <div style="background:var(--bg-card);border-radius:1rem;padding:1rem;margin-bottom:1.2rem;border-right:4px solid var(--user-info);">
                <div style="font-weight:700;color:var(--text-primary);" id="passwordUserInfo">تغيير كلمة المرور</div>
                <div style="font-size:0.8rem;color:var(--text-muted);">أدخل كلمة المرور الجديدة للمستخدم</div>
            </div>
            <div class="form-grid" style="grid-template-columns:1fr;">
                <div class="form-group">
                    <label>كلمة المرور الجديدة <span class="required">*</span></label>
                    <input type="password" id="newPassword" placeholder="أدخل كلمة المرور الجديدة" required minlength="6">
                    <span class="help-text">يجب أن تكون 6 أحرف على الأقل</span>
                </div>
                <div class="form-group">
                    <label>تأكيد كلمة المرور <span class="required">*</span></label>
                    <input type="password" id="confirmNewPassword" placeholder="أعد إدخال كلمة المرور" required minlength="6">
                </div>
                <div class="form-group">
                    <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:normal;">
                        <input type="checkbox" id="forceChangePassword" style="width:18px;height:18px;cursor:pointer;">
                        إجبار المستخدم على تغيير كلمة المرور عند أول دخول
                    </label>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="UsersManager.closeModal('passwordModal')">
                <i class="fas fa-times"></i> إلغاء
            </button>
            <button class="btn btn-primary" onclick="UsersManager.changePassword()">
                <i class="fas fa-key"></i> تغيير كلمة المرور
            </button>
        </div>
    </div>
</div>
