{% for user in users %}<tr><td>{{ forloop.counter }}</td><td>{{ user.username }}</td><td>{{ user.full_name }}</td><td>{{ user.email }}</td><td><span class="badge badge-purple">{{ user.role }}</span></td><td>{% include "users/partials/_status_badge.html" with is_active=user.is_active %}</td><td>{{ user.created_at }}</td><td><div class="flex gap-1"><a href="{% url 'users:detail' user.id %}" class="btn btn-sm btn-info"><i class="fas fa-eye"></i></a></div></td></tr>{% empty %}<tr><td colspan="8" class="text-center py-8 text-gray-500">لا توجد مستخدمين</td></tr>{% endfor %}
