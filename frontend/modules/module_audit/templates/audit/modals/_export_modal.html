<div class="modal-overlay" id="exportModal">
    <div class="modal-container">
        <div class="modal-header">
            <h2>📥 تصدير البيانات</h2>
            <button class="close-btn" onclick="closeModal('exportModal')">&times;</button>
        </div>
        <div style="display:grid;gap:12px;">
            <div class="form-group"><label>نوع التصدير</label><select><option value="pdf">PDF</option><option value="excel">Excel</option><option value="csv">CSV</option></select></div>
            <div class="form-group"><label>اسم التصدير</label><input type="text" placeholder="أدخل اسم الملف..."></div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal('exportModal')">إلغاء</button>
            <button class="btn btn-success">تصدير</button>
        </div>
    </div>
</div>
