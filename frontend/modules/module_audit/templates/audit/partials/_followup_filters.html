<!-- ============================================================
     فلاتر المتابعات
     ============================================================ -->
<div class="filter-bar" id="followupFilterBar">
    <!-- بحث -->
    <div class="filter-group">
        <label>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            بحث
        </label>
        <input type="text" 
               name="search" 
               placeholder="بحث في الملاحظات..." 
               value="{{ filters.search|default:'' }}"
               hx-get="/audit/api/followups/"
               hx-trigger="keyup changed delay:500ms"
               hx-target="#followupTable"
               hx-include="#followupFilterBar">
    </div>

    <!-- التصنيف -->
    <div class="filter-group">
        <label>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/>
            </svg>
            التصنيف
        </label>
        <select name="category"
                hx-get="/audit/api/followups/"
                hx-trigger="change"
                hx-target="#followupTable"
                hx-include="#followupFilterBar">
            <option value="">الكل</option>
            <option value="GENERAL" {% if filters.category == 'GENERAL' %}selected{% endif %}>📋 عام</option>
            <option value="URGENT" {% if filters.category == 'URGENT' %}selected{% endif %}>🔴 عاجل</option>
            <option value="REVIEW" {% if filters.category == 'REVIEW' %}selected{% endif %}>🔍 مراجعة</option>
            <option value="APPROVAL" {% if filters.category == 'APPROVAL' %}selected{% endif %}>✅ موافقة</option>
            <option value="FOLLOWUP" {% if filters.category == 'FOLLOWUP' %}selected{% endif %}>📌 متابعة</option>
        </select>
    </div>

    <!-- الحالة -->
    <div class="filter-group">
        <label>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
            </svg>
            الحالة
        </label>
        <select name="status"
                hx-get="/audit/api/followups/"
                hx-trigger="change"
                hx-target="#followupTable"
                hx-include="#followupFilterBar">
            <option value="">الكل</option>
            <option value="pending" {% if filters.status == 'pending' %}selected{% endif %}>⏳ معلقة</option>
            <option value="in_progress" {% if filters.status == 'in_progress' %}selected{% endif %}>🔄 قيد التنفيذ</option>
            <option value="completed" {% if filters.status == 'completed' %}selected{% endif %}>✅ مكتملة</option>
            <option value="escalated" {% if filters.status == 'escalated' %}selected{% endif %}>⬆️ مصعّدة</option>
        </select>
    </div>

    <!-- نوع المتابعة -->
    <div class="filter-group">
        <label>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/>
                <line x1="9" y1="21" x2="9" y2="9"/>
            </svg>
            النوع
        </label>
        <select name="followup_type"
                hx-get="/audit/api/followups/"
                hx-trigger="change"
                hx-target="#followupTable"
                hx-include="#followupFilterBar">
            <option value="">الكل</option>
            <option value="manual" {% if filters.followup_type == 'manual' %}selected{% endif %}>👤 يدوي</option>
            <option value="automatic" {% if filters.followup_type == 'automatic' %}selected{% endif %}>🤖 تلقائي</option>
            <option value="reminder" {% if filters.followup_type == 'reminder' %}selected{% endif %}>🔔 تذكير</option>
        </select>
    </div>

    <!-- أزرار -->
    <button class="btn-search" 
            hx-get="/audit/api/followups/" 
            hx-target="#followupTable" 
            hx-include="#followupFilterBar"
            hx-trigger="click">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        بحث
    </button>
    
    <button class="btn-reset" 
            onclick="resetFollowupFilters()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/>
        </svg>
        إعادة تعيين
    </button>

    <button class="btn-search" style="background: #8b5cf6;" 
            onclick="openModal('followupAddModal')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        متابعة جديدة
    </button>
</div>
