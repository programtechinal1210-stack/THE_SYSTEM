<div>
    {% if anomalies %}
        {% for a in anomalies %}
        <div class="anomaly-card {% if a.severity == 'critical' %}critical{% endif %}">
            <div class="anomaly-header">
                <span class="badge {% if a.severity == 'critical' %}badge-danger{% else %}badge-warning{% endif %}">{{ a.severity|default:"warning" }}</span>
                <span style="font-size:12px;">{{ a.detected_at|default:a.created_at|slice:":19" }}</span>
            </div>
            <div class="anomaly-title">{{ a.title|default:a.anomaly_type_code|default:"حالة شاذة" }}</div>
            <div class="anomaly-description">{{ a.description|default:""|truncatechars:100 }}</div>
        </div>
        {% endfor %}
    {% else %}
        <p style="text-align:center;padding:40px;">لا توجد حالات شاذة</p>
    {% endif %}
</div>
