<!-- ============================================================
     فلاتر التصدير
     ============================================================ -->
<div class="filter-bar" id="exportFilterBar">
    <!-- بحث -->
    <div class="filter-group">
        <label>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            بحث
        </label>
        <input type="text" 
               name="search" 
               placeholder="اسم التصدير..." 
               value="{{ filters.search|default:'' }}"
               hx-get="/audit/api/exports/"
               hx-trigger="keyup changed delay:500ms"
               hx-target="#exportTable"
               hx-include="#exportFilterBar">
    </div>

    <!-- نوع التصدير -->
    <div class="filter-group">
        <label>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
            </svg>
            نوع التصدير
        </label>
        <select name="export_type"
                hx-get="/audit/api/exports/"
                hx-trigger="change"
                hx-target="#exportTable"
                hx-include="#exportFilterBar">
            <option value="">الكل</option>
            <option value="pdf" {% if filters.export_type == 'pdf' %}selected{% endif %}>📄 PDF</option>
            <option value="excel" {% if filters.export_type == 'excel' %}selected{% endif %}>📊 Excel</option>
            <option value="csv" {% if filters.export_type == 'csv' %}selected{% endif %}>📋 CSV</option>
            <option value="json" {% if filters.export_type == 'json' %}selected{% endif %}>📦 JSON</option>
            <option value="full_dump" {% if filters.export_type == 'full_dump' %}selected{% endif %}>💾 نسخة كاملة</option>
        </select>
    </div>

    <!-- الكيان -->
    <div class="filter-group">
        <label>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/>
            </svg>
            الكيان
        </label>
        <select name="entity_type"
                hx-get="/audit/api/exports/"
                hx-trigger="change"
                hx-target="#exportTable"
                hx-include="#exportFilterBar">
            <option value="">الكل</option>
            <option value="audit" {% if filters.entity_type == 'audit' %}selected{% endif %}>🔍 سجل التدقيق</option>
            <option value="followup" {% if filters.entity_type == 'followup' %}selected{% endif %}>📋 المتابعات</option>
            <option value="execution" {% if filters.entity_type == 'execution' %}selected{% endif %}>⚡ سجل التنفيذ</option>
            <option value="anomaly" {% if filters.entity_type == 'anomaly' %}selected{% endif %}>⚠️ الحالات الشاذة</option>
        </select>
    </div>

    <!-- الحالة -->
    <div class="filter-group">
        <label>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
            </svg>
            الحالة
        </label>
        <select name="status"
                hx-get="/audit/api/exports/"
                hx-trigger="change"
                hx-target="#exportTable"
                hx-include="#exportFilterBar">
            <option value="">الكل</option>
            <option value="pending" {% if filters.status == 'pending' %}selected{% endif %}>⏳ قيد الانتظار</option>
            <option value="processing" {% if filters.status == 'processing' %}selected{% endif %}>🔄 جاري المعالجة</option>
            <option value="completed" {% if filters.status == 'completed' %}selected{% endif %}>✅ مكتمل</option>
            <option value="failed" {% if filters.status == 'failed' %}selected{% endif %}>❌ فشل</option>
        </select>
    </div>

    <!-- أزرار -->
    <button class="btn-search" 
            hx-get="/audit/api/exports/" 
            hx-target="#exportTable" 
            hx-include="#exportFilterBar"
            hx-trigger="click">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        بحث
    </button>
    
    <button class="btn-reset" 
            onclick="resetExportFilters()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/>
        </svg>
        إعادة تعيين
    </button>

    <button class="btn-search" style="background: #22c55e;" 
            onclick="openModal('exportModal')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        تصدير جديد
    </button>
</div>
