<!-- ============================================================
     فلاتر سجل التنفيذ
     ============================================================ -->
<div class="filter-bar" id="executionFilterBar">
    <!-- بحث -->
    <div class="filter-group">
        <label>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            بحث
        </label>
        <input type="text" 
               name="search" 
               placeholder="كيان، مستخدم، ملاحظات..." 
               value="{{ filters.search|default:'' }}"
               hx-get="/audit/api/execution/"
               hx-trigger="keyup changed delay:500ms"
               hx-target="#executionTable"
               hx-include="#executionFilterBar">
    </div>

    <!-- نوع الكيان -->
    <div class="filter-group">
        <label>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/>
            </svg>
            نوع الكيان
        </label>
        <select name="entity_type"
                hx-get="/audit/api/execution/"
                hx-trigger="change"
                hx-target="#executionTable"
                hx-include="#executionFilterBar">
            <option value="">الكل</option>
            <option value="directive" {% if filters.entity_type == 'directive' %}selected{% endif %}>📢 توجيه</option>
            <option value="task" {% if filters.entity_type == 'task' %}selected{% endif %}>✅ مهمة</option>
            <option value="action" {% if filters.entity_type == 'action' %}selected{% endif %}>⚡ إجراء</option>
        </select>
    </div>

    <!-- نوع التنفيذ -->
    <div class="filter-group">
        <label>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="14 2 18 6 14 10"/><path d="M3 12v3a2 2 0 002 2h14a2 2 0 002-2v-3"/>
            </svg>
            نوع التنفيذ
        </label>
        <select name="execution_type"
                hx-get="/audit/api/execution/"
                hx-trigger="change"
                hx-target="#executionTable"
                hx-include="#executionFilterBar">
            <option value="">الكل</option>
            <option value="status_change" {% if filters.execution_type == 'status_change' %}selected{% endif %}>🔄 تغيير حالة</option>
            <option value="assignment" {% if filters.execution_type == 'assignment' %}selected{% endif %}>👤 تعيين</option>
            <option value="escalation" {% if filters.execution_type == 'escalation' %}selected{% endif %}>⬆️ تصعيد</option>
            <option value="comment" {% if filters.execution_type == 'comment' %}selected{% endif %}>💬 تعليق</option>
            <option value="review" {% if filters.execution_type == 'review' %}selected{% endif %}>🔍 مراجعة</option>
        </select>
    </div>

    <!-- حالة التأخير -->
    <div class="filter-group">
        <label>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
            </svg>
            التأخير
        </label>
        <select name="is_delayed"
                hx-get="/audit/api/execution/"
                hx-trigger="change"
                hx-target="#executionTable"
                hx-include="#executionFilterBar">
            <option value="">الكل</option>
            <option value="true" {% if filters.is_delayed == 'true' %}selected{% endif %}>⚠️ متأخر فقط</option>
            <option value="false" {% if filters.is_delayed == 'false' %}selected{% endif %}>✅ في الوقت المحدد</option>
        </select>
    </div>

    <!-- أزرار -->
    <button class="btn-search" 
            hx-get="/audit/api/execution/" 
            hx-target="#executionTable" 
            hx-include="#executionFilterBar"
            hx-trigger="click">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        بحث
    </button>
    
    <button class="btn-reset" 
            onclick="resetExecutionFilters()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/>
        </svg>
        إعادة تعيين
    </button>
</div>
