<div class="modal-overlay" id="alertAddModal" style="display:none;">
    <div class="modal-container">
        <div class="modal-header">
            <h2>🔔 تنبيه جديد</h2>
            <button class="close-btn" onclick="closeModal('alertAddModal')">&times;</button>
        </div>
        <form onsubmit="saveAlert(event)" style="display:grid;gap:12px;">
            <div class="form-group">
                <label>اسم التنبيه</label>
                <input type="text" name="name" required placeholder="أدخل اسم التنبيه...">
            </div>
            <div class="form-group">
                <label>الوحدة</label>
                <select name="module">
                    <option value="cases">المعاملات</option>
                    <option value="users">المستخدمون</option>
                    <option value="execution">التنفيذ</option>
                </select>
            </div>
            <div class="form-group">
                <label>مستوى الخطورة</label>
                <select name="severity_threshold">
                    <option value="info">معلومات</option>
                    <option value="warning">تحذير</option>
                    <option value="critical">حرج</option>
                </select>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeModal('alertAddModal')">إلغاء</button>
                <button type="submit" class="btn btn-primary">حفظ</button>
            </div>
        </form>
    </div>
</div>
