<div class="modal-overlay" id="exportModal" style="display:none;">
    <div class="modal-container">
        <div class="modal-header">
            <h2>📥 تصدير البيانات</h2>
            <button class="close-btn" onclick="closeModal('exportModal')">&times;</button>
        </div>
        <form onsubmit="exportData(event)" style="display:grid;gap:12px;">
            <div class="form-group">
                <label>نوع التصدير</label>
                <select name="export_type">
                    <option value="pdf">PDF</option>
                    <option value="excel">Excel</option>
                    <option value="csv">CSV</option>
                </select>
            </div>
            <div class="form-group">
                <label>الكيان</label>
                <select name="entity_type">
                    <option value="audit">سجل التدقيق</option>
                    <option value="followup">المتابعات</option>
                </select>
            </div>
            <div class="form-group">
                <label>اسم التصدير</label>
                <input type="text" name="export_name" placeholder="أدخل اسم الملف...">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeModal('exportModal')">إلغاء</button>
                <button type="submit" class="btn btn-success">تصدير</button>
            </div>
        </form>
    </div>
</div>
