{% extends "base.html" %} {% load static %} {% block title %}الإشعارات -{% endblock %} {% block extra_head %} <style> /* أنماط الإشعارات */ .notification-filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; } .notification-filters .btn { padding: 8px 20px; border: 2px solid #e0e5ec; border-radius: 20px; background: white; cursor: pointer; font-size: 14px; transition: all 0.3s; } .notification-filters .btn:hover { border-color: #2d6a9f; } .notification-filters .btn.active { background: #2d6a9f; color: white; border-color: #2d6a9f; } .notification-list { display: flex; flex-direction: column; gap: 10px; } .notification-item { background: white; border-radius: 12px; padding: 18px 22px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; align-items: flex-start; gap: 15px; transition: all 0.3s; border-right: 4px solid transparent; } .notification-item:hover { transform: translateX(-4px); box-shadow: 0 4px 15px rgba(0,0,0,0.08); } .notification-item.unread { border-right-color: #2d6a9f; background: #f8faff; } .notification-item .icon { font-size: 28px; flex-shrink: 0; margin-top: 2px; } .notification-item .content { flex: 1; } .notification-item .content .title { font-weight: 600; color: #1a3a5c; font-size: 16px; } .notification-item .content .text { color: #555; font-size: 14px; margin-top: 3px; } .notification-item .content .time { color: #7a8a9e; font-size: 12px; margin-top: 5px; } .notification-item .actions { display: flex; gap: 8px; flex-shrink: 0; } .notification-item .actions .btn { padding: 4px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; transition: all 0.2s; } .notification-item .actions .btn-primary { background: #2d6a9f; color: white; } .notification-item .actions .btn-primary:hover { background: #1a3a5c; } .notification-item .actions .btn-secondary { background: #eef2f7; color: #555; } .notification-item .actions .btn-secondary:hover { background: #d5dbe3; } @media (max-width: 768px) { .notification-item { flex-wrap: wrap; } .notification-item .actions { width: 100%; justify-content: flex-end; } .notification-filters { overflow-x: auto; flex-wrap: nowrap; } .notification-filters .btn { white-space: nowrap; } } </style> {% endblock %} {% block page_title %}🔔 الإشعارات{% endblock %} {% block breadcrumb_text %}الإشعارات{% endblock %} {% block page_stats %} <button onclick="markAllRead" style="padding:8px 20px;background:#2d6a9f;color:white;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;"> ✅ تحديد الكل كمقروء </button> {% endblock %} {% block content %} <!-- فلاتر الإشعارات --> <div class="notification-filters"> <button class="btn active" onclick="filterNotifications('all', this)">📋 الكل</button> <button class="btn" onclick="filterNotifications('unread', this)">🔴 غير مقروء</button> <button class="btn" onclick="filterNotifications('read', this)">✅ مقروء</button> <button class="btn" onclick="filterNotifications('referral', this)">📌 إحالات</button> <button class="btn" onclick="filterNotifications('alert', this)">⚠️ تنبيهات</button> <button class="btn" onclick="filterNotifications('general', this)">📢 إشعارات عامة</button> </div> <!-- قائمة الإشعارات --> <div class="notification-list" id="notificationsList"> <!-- يتم إضافة الإشعارات بواسطة JavaScript --> </div> <div class="pagination" id="pagination"> <span class="active">1</span> </div> <script> // ===== البيانات من المصفوفات ===== let notificationsData = [ {% for notification in notifications %} { id: "{{ notification.id }}", type: "{{ notification.type }}", title: "{{ notification.title }}", content: "{{ notification.content }}", time: "{{ notification.created_at }}", read: {{ notification.is_read|lower }} }, {% endfor %} ]; let currentFilter = 'all'; let currentPage = 1; const itemsPerPage = 5; // ===== عرض البيانات ===== function renderNotifications { var filtered = notificationsData.filter(function(n) { if (currentFilter === 'unread') return !n.read; if (currentFilter === 'read') return n.read; if (currentFilter === 'referral') return n.type === 'referral'; if (currentFilter === 'alert') return n.type === 'alert'; if (currentFilter === 'general') return n.type === 'general'; return true; }); var start = (currentPage - 1) * itemsPerPage; var pageItems = filtered.slice(start, start + itemsPerPage); var list = document.getElementById('notificationsList'); if (pageItems.length === 0) { list.innerHTML = '<div style="text-align:center;padding:60px;color:#7a8a9e;background:white;border-radius:16px;"><div style="font-size:64px;margin-bottom:10px;">🔔</div><div style="font-size:20px;font-weight:600;color:#1a3a5c;">لا توجد إشعارات</div><div style="font-size:14px;">' + (currentFilter === 'unread' ? 'ليس لديك إشعارات غير مقروءة' : '') + '</div></div>'; return; } var iconMap = { 'referral': '📨', 'alert': '⚠️', 'general': '📢' }; var html = ''; for (var i = 0; i < pageItems.length; i++) { var n = pageItems[i]; var unreadClass = !n.read ? 'unread' : ''; html += '<div class="notification-item ' + unreadClass + '">' + '<span class="icon">' + (iconMap[n.type] || '📌') + '</span>' + '<div class="content">' + '<div class="title">' + n.title + '</div>' + '<div class="text">' + n.content + '</div>' + '<div class="time">📅 ' + n.time + '</div>' + '</div>' + '<div class="actions">'; if (!n.read) { html += '<button class="btn btn-primary" onclick="markAsRead(\'' + n.id + '\')">✔️ قرأت</button>'; } html += '<button class="btn btn-secondary" onclick="showToast(\'📋 عرض الإشعار: ' + n.title + '\', \'info\')">📖 عرض</button>' + '</div></div>'; } list.innerHTML = html; renderPagination(filtered.length); } function renderPagination(total) { var pages = Math.ceil(total / itemsPerPage); var container = document.getElementById('pagination'); if (pages <= 1) { container.innerHTML = '<span class="active">1</span>'; return; } var html = ''; if (currentPage > 1) html += '<a onclick="changePage(' + (currentPage - 1) + ')">‹</a>'; for (var i = 1; i <= pages; i++) { html += i === currentPage ? '<span class="active">' + i + '</span>' : '<a onclick="changePage(' + i + ')">' + i + '</a>'; } if (currentPage < pages) html += '<a onclick="changePage(' + (currentPage + 1) + ')">›</a>'; container.innerHTML = html; } function changePage(page) { currentPage = page; renderNotifications; } // ===== عمليات الإشعارات ===== function filterNotifications(filter, element) { currentFilter = filter; currentPage = 1; document.querySelectorAll('.notification-filters .btn').forEach(function(b) { b.classList.remove('active'); }); if (element) element.classList.add('active'); renderNotifications; } function markAsRead(id) { var n = null; for (var i = 0; i < notificationsData.length; i++) { if (notificationsData[i].id === id) { n = notificationsData[i]; break; } } if (n) { n.read = true; renderNotifications; showToast('✅ تم تحديد الإشعار كمقروء', 'success'); var unreadCount = 0; for (var j = 0; j < notificationsData.length; j++) { if (!notificationsData[j].read) unreadCount++; } document.querySelector('.navbar .badge').textContent = unreadCount; } } function markAllRead { var unread = []; for (var i = 0; i < notificationsData.length; i++) { if (!notificationsData[i].read) unread.push(notificationsData[i]); } if (unread.length === 0) { showToast('📋 جميع الإشعارات مقروءة بالفعل', 'info'); return; } if (confirm('⚠️ هل أنت متأكد من تحديد جميع الإشعارات (' + unread.length + ') كمقروءة؟')) { for (var j = 0; j < notificationsData.length; j++) { notificationsData[j].read = true; } renderNotifications; document.querySelector('.navbar .badge').textContent = '0'; showToast('✅ تم تحديد ' + unread.length + ' إشعار كمقروء', 'success'); } } document.addEventListener('DOMContentLoaded', function { renderNotifications; }); </script> {% endblock %}
