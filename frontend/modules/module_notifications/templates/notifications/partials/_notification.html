{% for notification in notifications %}<div class="p-4 hover:bg-gray-50 transition-colors border-b border-gray-100 {% if not notification.is_read %}bg-blue-50{% endif %}"><div class="flex items-start gap-3"><div class="flex-shrink-0 mt-1">{% if not notification.is_read %}<span class="w-2 h-2 bg-blue-500 rounded-full inline-block"></span>{% else %}<span class="w-2 h-2 bg-gray-300 rounded-full inline-block"></span>{% endif %}</div><div class="flex-1"><div class="flex items-center gap-2"><span class="badge {% if notification.type == 'info' %}badge-blue{% elif notification.type == 'success' %}badge-green{% elif notification.type == 'warning' %}badge-yellow{% else %}badge-red{% endif %}">{{ notification.type }}</span><span class="text-xs text-gray-400">{{ notification.created_at }}</span></div><h3 class="font-semibold text-gray-800">{{ notification.title }}</h3><p class="text-gray-600 text-sm">{{ notification.content }}</p></div></div></div>{% empty %}<div class="p-8 text-center text-gray-500"><i class="fas fa-inbox text-4xl block mb-2"></i>لا توجد إشعارات</div>{% endfor %}
