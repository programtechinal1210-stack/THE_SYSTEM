<div class="p-3 border-b border-gray-200"><h3 class="font-semibold">الإشعارات</h3><span class="text-xs text-gray-500">{{ unread_count|default:0 }} غير مقروءة</span></div>
<div class="max-h-80 overflow-y-auto">{% for notif in notifications %}<a href="{% url 'notifications:mark_read' notif.id %}?next={{ notif.link|default:'/notifications/' }}" class="block p-3 hover:bg-gray-50 border-b border-gray-100 {% if not notif.is_read %}bg-blue-50{% endif %}"><div class="flex items-start gap-2"><span class="w-2 h-2 mt-2 {% if not notif.is_read %}bg-blue-500{% else %}bg-gray-300{% endif %} rounded-full"></span><div><p class="text-sm font-medium">{{ notif.title }}</p><p class="text-xs text-gray-500">{{ notif.content|truncatechars:50 }}</p><span class="text-xs text-gray-400">{{ notif.created_at }}</span></div></div></a>{% empty %}<div class="p-4 text-center text-gray-500"><i class="fas fa-inbox text-2xl block mb-2"></i>لا توجد إشعارات جديدة</div>{% endfor %}</div>
<div class="p-2 border-t border-gray-200 text-center"><a href="{% url 'notifications:list' %}" class="text-sm text-blue-600 hover:underline">عرض جميع الإشعارات</a></div>
