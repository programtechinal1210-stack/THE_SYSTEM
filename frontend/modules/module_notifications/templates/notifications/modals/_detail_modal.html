<div class="modal-overlay fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center" id="notificationModal" onclick="if(event.target===this)closeModal()"><div class="bg-white rounded-xl shadow-2xl max-w-2xl w-full mx-4 max-h-[90vh] overflow-y-auto"><div class="flex items-center justify-between p-4 border-b border-gray-200"><div class="flex items-center gap-2"><span class="badge {% if notification.type == 'info' %}badge-blue{% elif notification.type == 'success' %}badge-green{% elif notification.type == 'warning' %}badge-yellow{% else %}badge-red{% endif %}">{{ notification.type }}</span><span class="text-xs text-gray-400">{{ notification.created_at }}</span></div><button onclick="closeModal()" class="p-1 hover:bg-gray-100 rounded-lg"><i class="fas fa-times text-gray-500"></i></button></div><div class="p-6"><h2 class="text-2xl font-bold text-gray-800 mb-4">{{ notification.title }}</h2><p class="text-gray-700">{{ notification.content }}</p>{% if notification.link %}<div class="mt-6 pt-4 border-t"><a href="{{ notification.link }}" class="btn btn-primary btn-sm" onclick="closeModal()"><i class="fas fa-arrow-left ml-2"></i>عرض التفاصيل</a></div>{% endif %}</div><div class="flex justify-end gap-2 p-4 border-t border-gray-200">{% if not notification.is_read %}<a href="{% url 'notifications:mark_read' notification.id %}" class="btn btn-success btn-sm" onclick="closeModal()"><i class="fas fa-check ml-1"></i>تعليم كمقروء</a>{% endif %}<button onclick="closeModal()" class="btn btn-outline btn-sm">إغلاق</button></div></div></div>
<script>
function openModal(){const m=document.getElementById("notificationModal");if(m){m.classList.remove("hidden");document.body.style.overflow="hidden";}}
function closeModal(){const m=document.getElementById("notificationModal");if(m){m.classList.add("hidden");document.body.style.overflow="";}}
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeModal();});
</script>
