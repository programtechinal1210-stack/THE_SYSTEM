{% if work_context.items %}
<form method="post" action="{% url 'work_context' %}" class="core-work-context">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.path }}">
    <details class="core-work-context__details" data-topbar-menu>
        <summary class="core-work-context__summary" aria-label="اختيار المؤسسة النشطة" title="اختيار المؤسسة النشطة">
            <i class="fas fa-building" aria-hidden="true"></i>
            <span class="core-work-context__label">
                <small>المؤسسة النشطة</small>
                <strong>
                    {% for org in work_context.items %}
                        {% if org.id == work_context.selected_id %}{{ org.name }}{% endif %}
                    {% endfor %}
                </strong>
            </span>
            <i class="fas fa-chevron-down core-work-context__chevron" aria-hidden="true"></i>
        </summary>
        <div class="core-work-context__menu" role="menu" aria-label="المؤسسات المتاحة">
            {% for org in work_context.items %}
            <button type="submit" name="organization_id" value="{{ org.id }}" role="menuitemradio" aria-checked="{% if org.id == work_context.selected_id %}true{% else %}false{% endif %}" class="core-work-context__option{% if org.id == work_context.selected_id %} is-active{% endif %}">
                <i class="fas {% if org.id == work_context.selected_id %}fa-check-circle{% else %}fa-building{% endif %}" aria-hidden="true"></i>
                <span>{{ org.name }}</span>
            </button>
            {% endfor %}
        </div>
    </details>
</form>
{% endif %}
