{% if section == 'users' %}<form method="get" class="core-filter-bar"><label class="core-filter-search">البحث عن مستخدم<input name="search" value="{{ request.GET.search }}" placeholder="الاسم أو اسم المستخدم…"></label><label>الحالة<select name="is_active"><option value="">كل الحالات</option><option value="true" {% if request.GET.is_active == 'true' %}selected{% endif %}>نشط</option><option value="false" {% if request.GET.is_active == 'false' %}selected{% endif %}>معطل</option></select></label>{% if units %}<label>الوحدة التنظيمية<select name="organization_id"><option value="">جميع الوحدات</option>{% for unit in units %}<option value="{{ unit.id }}" {% if request.GET.organization_id == unit.id %}selected{% endif %}>{{ unit.name }}</option>{% endfor %}</select></label>{% elif request.GET.organization_id %}<input type="hidden" name="organization_id" value="{{ request.GET.organization_id }}">{% endif %}<button class="btn btn-primary">بحث</button><a class="btn" href="/users/">إعادة ضبط</a>{% if can_export_users %}<a class="btn" href="/users/export/core/?{{ request.GET.urlencode }}">تصدير</a>{% endif %}</form>{% endif %}
