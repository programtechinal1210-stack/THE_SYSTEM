<!-- ═══════════════════════════════════════════════════════════════
   👤 قائمة المستخدم
   ═══════════════════════════════════════════════════════════════ -->

<div class="relative">
    <button id="userMenuBtn" 
            class="flex items-center gap-3 px-2 py-1.5 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-800 transition-all duration-200"
            onclick="toggleUserMenu()"
            aria-label="قائمة المستخدم">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-blue-500 to-blue-700 flex items-center justify-center text-white text-sm font-bold shadow-md shadow-blue-500/20">
            {{ request.session.full_name|default:"م"|slice:":1" }}
        </div>
        <div class="hidden md:block text-right">
            <p class="text-sm font-semibold text-gray-800 dark:text-gray-200 leading-tight">{{ request.session.full_name|default:"المستخدم" }}</p>
            <p class="text-xs text-gray-500 dark:text-gray-400 leading-tight">{{ request.session.role|default:"مدير" }}</p>
        </div>
        <i class="ph ph-caret-down text-gray-400 hidden md:block"></i>
    </button>
    
    <!-- القائمة المنسدلة -->
    <div id="userMenu" 
         class="absolute left-0 mt-2 w-72 bg-white dark:bg-gray-800 rounded-2xl shadow-2xl border border-gray-200 dark:border-gray-700 z-50 hidden animate-scale-in overflow-hidden">
        
        <!-- معلومات المستخدم -->
        <div class="p-4 bg-gradient-to-br from-blue-50 to-blue-100 dark:from-blue-900/20 dark:to-blue-800/20">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-blue-500 to-blue-700 flex items-center justify-center text-white text-lg font-bold shadow-lg shadow-blue-500/20">
                    {{ request.session.full_name|default:"م"|slice:":1" }}
                </div>
                <div>
                    <p class="text-sm font-bold text-gray-800 dark:text-gray-200">{{ request.session.full_name|default:"المستخدم" }}</p>
                    <p class="text-xs text-gray-500 dark:text-gray-400">{{ request.session.email|default:"user@goms.gov" }}</p>
                </div>
            </div>
        </div>
        
        <!-- الروابط -->
        <div class="p-2">
            <a href="/users/profile/" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-700 transition-all duration-200">
                <i class="ph ph-user text-lg text-gray-500 dark:text-gray-400"></i>
                <div>
                    <p class="text-sm font-medium text-gray-800 dark:text-gray-200">الملف الشخصي</p>
                    <p class="text-xs text-gray-500 dark:text-gray-400">عرض وتعديل بياناتك</p>
                </div>
            </a>
            
            <a href="/users/profile/settings/" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-700 transition-all duration-200">
                <i class="ph ph-gear text-lg text-gray-500 dark:text-gray-400"></i>
                <div>
                    <p class="text-sm font-medium text-gray-800 dark:text-gray-200">الإعدادات</p>
                    <p class="text-xs text-gray-500 dark:text-gray-400">تخصيص النظام</p>
                </div>
            </a>
            
            <hr class="my-2 border-gray-200 dark:border-gray-700">
            
            <a href="/auth/logout/" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-red-50 dark:hover:bg-red-900/20 transition-all duration-200 text-red-600 dark:text-red-400">
                <i class="ph ph-sign-out text-lg"></i>
                <div>
                    <p class="text-sm font-medium">تسجيل الخروج</p>
                </div>
            </a>
        </div>
    </div>
</div>

<script>
    function toggleUserMenu() {
        const menu = document.getElementById('userMenu');
        menu.classList.toggle('hidden');
        
        if (!menu.classList.contains('hidden')) {
            setTimeout(() => {
                document.addEventListener('click', function closeMenu(e) {
                    if (!menu.contains(e.target) && !e.target.closest('#userMenuBtn')) {
                        menu.classList.add('hidden');
                        document.removeEventListener('click', closeMenu);
                    }
                });
            }, 100);
        }
    }
</script>
